<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1 {text-align: center}
    .disp {width:205px; height:40px; margin-top: 3px;}
    .disp {font-family: "Oxanium", sans-serif; font-size: 22pt; text-align: right;} 
    input[type="button"] {
    width: 50px;
    height: 50px;
    text-align: center;
    vertical-align: middle;
    margin-top: 5px;
}
    #calc {width: 220px; margin-left: auto; margin-right: auto;}
</style>
<script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
<script>
$(function () {
    let cal_val = null; 
    let counter = null; 

    function calculate(left, right, operator) {
        switch (operator) {
            case "+": return left + right;
            case "-": return left - right;
            case "*": return left * right;
            case "/": return left / right;
        }
    }

    $(".num").click(function () {
        if (counter === null && cal_val !== null) {
            cal_val = null;
            $("#disp1").val("");
            $("#disp2").val("");
        }

        const cur = $("#disp2").val();
        $("#disp2").val(cur + $(this).val());
    });

    $(".op").click(function () {
        const cur = $("#disp2").val();
        const opt = $(this).val();

        if (cur === "") {
            if (cal_val !== null && opt !== "=") {
                counter = opt;
            }
            return;
        }

        const number = Number(cur);

        if (cal_val === null) {
            cal_val = number;
        } else if (counter !== null) {
            cal_val = calculate(cal_val, number, counter);
        }

        if (!Number.isFinite(cal_val)) {
            $("#disp1").val("오류");
            $("#disp2").val("");
            cal_val = null;
            counter = null;
            return;
        }

        $("#disp1").val(cal_val);
        $("#disp2").val("");
        counter = opt === "=" ? null : opt;
    });

    $(".func").click(function () {
        cal_val = null;
        counter = null;
        $("#disp1").val("");
        $("#disp2").val("");
    });
});
</script>
<body>
    <h1>계산기</h1>
    <div id="calc">
        <div>
            <input type="text" class="disp" id="disp1" readonly>
            <input type="text" class="disp" id="disp2" readonly>
        </div>
        <input type="button" class="num" value="7">
        <input type="button" class="num" value="8">
        <input type="button" class="num" value="9">
        <input type="button" class="op" value="+"><br>
        <input type="button" class="num" value="4">
        <input type="button" class="num" value="5">
        <input type="button" class="num" value="6">
        <input type="button" class="op" value="-"><br>
        <input type="button" class="num" value="1">
        <input type="button" class="num" value="2">
        <input type="button" class="num" value="3">
        <input type="button" class="op" value="*"><br>
        <input type="button" class="func" value="ac">
        <input type="button" class="num" value="0">
        <input type="button" class="op" value="/">
        <input type="button" class="op" value="=">
        
        
    </div>
</body>
</html>
