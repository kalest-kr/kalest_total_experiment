<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>표</title>
</head>
<style>
    td {background-color:#ccffff;}
    .time {background-color: white;}
    .DL {background-color: turquoise;}
    .WTF {background-color: #ff6666;}
    .HOME {background-color: #66cc00;}
    .NLP {background-color: #66FF00;}
    .DB {background-color: #2596f8;}
    .web_dev {background-color: #ffccff;}
    .ML {background-color: #ff6699;}
    .AI {background-color: #ff9900;}


</style>
<body>
    <h1>시간</h1>
    <table border="1">
        <thead>
            <tr>
                <th>시간</th>
                <th>월요일</th>
                <th>화요일</th>
                <th>수요일</th>
                <th>목요일</th>
                <th>금요일</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="time">00:09</td>
                <td rowspan="2"></td>
                <td rowspan="3", class="web_dev">웹프로그래밍</td>
                <td rowspan="9"></td>
                <td rowspan="3", class="DB">데이터 베이스 설계</td>
                <td rowspan="9"></td>
            </tr>
            <tr>
                <!--<td>내용21</td>-->
                <td class="time">10:00</td>
            </tr>
            <tr>
                <!--<td>내용21</td>-->
                <td class="time">11:00</td>
                <td class="WTF">채플</td>
            </tr>
            <tr>
                <!--<td>내용21</td>-->
                <td class="time">12:00</td>
                <td></td>
                <td rowspan="3", class="ML">기계학습</td>
                <td rowspan="2"></td>
            </tr>
            <tr>
                <!--<td>내용21</td>-->
                <td class="time">01:00</td>
                <td rowspan="3", class="DL">딥러닝 응용</td>
            </tr>
            <tr>
                <!--<td>내용21</td>-->
                <td class="time">02:00</td>
                <td rowspan="3", class="NLP">자연어처리</td>
            </tr>
            <tr>
                <!--<td>내용21</td>-->
                <td class="time">03:00</td>
                <td rowspan="3", class="AI">인공지능</td>
            </tr>
            <tr>
                <!--<td>내용21</td>-->
                <td class="time">04:00</td>
                <td class="HOME" rowspan="2">귀가</td>
            </tr>
            <tr>
                <!--<td>내용21</td>-->
                <td class="time">05:00</td>
                <td class="HOME", rowspan="1">귀가</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td class="time">07:00</td>
                <td>자율</td>
                <td class="HOME">귀가</td>
                <td>자율</td>
                <td class="HOME">귀가</td>
                <td>자율</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
