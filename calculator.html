<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f4f0">
  <title>간단한 계산기</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 28px 16px; background: #f6f4f0; color: #292e32; }
    main { width: min(100%, 368px); }
    .heading { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 22px; }
    h1 { margin: 0; font-size: 23px; font-weight: 700; letter-spacing: -1px; }
    .badge { color: #777b7d; font-size: 11px; letter-spacing: 2px; }
    .calculator { padding: 20px; border: 1px solid #e5e2dc; border-radius: 28px; background: #fff; box-shadow: 0 16px 45px #3831260b; }
    .screen { display: flex; flex-direction: column; justify-content: flex-end; min-height: 146px; padding: 21px 18px 18px; margin-bottom: 20px; border-radius: 16px; background: #f4f5f1; text-align: right; }
    .expression { min-height: 24px; color: #70766f; font-size: 14px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    output { display: block; margin-top: 9px; font-size: clamp(29px, 8vw, 43px); font-weight: 500; line-height: 1.25; letter-spacing: -1.5px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
    output.long { font-size: 27px; letter-spacing: -1px; }
    output.error { color: #b33e2d; font-size: 27px; }
    .keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    button { min-width: 0; min-height: 62px; border: 0; border-radius: 14px; background: #f5f5f4; color: #292e32; font: inherit; font-size: 23px; font-weight: 500; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: background .12s, transform .12s; }
    button:hover { background: #e9eae7; }
    button:active, button.pressed { transform: scale(.95); background: #e1e3df; }
    button:focus-visible { outline: 3px solid #4e7569; outline-offset: 3px; }
    .utility { background: #e9ede7; color: #4a6053; font-size: 19px; }
    .operator { background: #fff0e9; color: #b95737; font-size: 27px; }
    .operator:hover, .operator.selected { background: #ffddcb; }
    .equals { background: #ce6544; color: white; }
    .equals:hover, .equals.pressed { background: #b95032; }
    .zero { grid-column: span 2; }
    .help { margin: 21px 2px 0; text-align: center; color: #6f7373; font-size: 12px; line-height: 1.9; word-break: keep-all; }
    kbd { font: inherit; color: #4d5455; }
    .mode { display: block; margin-top: 6px; font-size: 11px; color: #818584; }
    .load-error { margin: 16px 0 0; padding: 12px; border-radius: 10px; background: #fff0e9; color: #963b26; font-size: 13px; line-height: 1.6; }
    [hidden] { display: none !important; }
    @media (max-width: 360px) { .calculator { padding: 15px; } .keys { gap: 8px; } button { min-height: 57px; } }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header class="heading">
      <h1>간단한 계산기</h1>
      <span class="badge">CALCULATOR</span>
    </header>
    <section class="calculator" aria-label="사칙연산 계산기">
      <div class="screen" aria-live="polite" aria-atomic="true">
        <div id="expression" class="expression"></div>
        <output id="display" aria-label="계산 결과">0</output>
      </div>
      <div class="keys">
        <button type="button" class="utility" data-action="clear" aria-label="모두 지우기">AC</button>
        <button type="button" class="utility" data-action="sign" aria-label="양수 음수 전환">±</button>
        <button type="button" class="utility" data-action="backspace" aria-label="마지막 숫자 지우기">⌫</button>
        <button type="button" class="operator" data-action="operator" data-value="/" aria-label="나누기">÷</button>
        <button type="button" data-action="digit" data-value="7">7</button>
        <button type="button" data-action="digit" data-value="8">8</button>
        <button type="button" data-action="digit" data-value="9">9</button>
        <button type="button" class="operator" data-action="operator" data-value="*" aria-label="곱하기">×</button>
        <button type="button" data-action="digit" data-value="4">4</button>
        <button type="button" data-action="digit" data-value="5">5</button>
        <button type="button" data-action="digit" data-value="6">6</button>
        <button type="button" class="operator" data-action="operator" data-value="-" aria-label="빼기">−</button>
        <button type="button" data-action="digit" data-value="1">1</button>
        <button type="button" data-action="digit" data-value="2">2</button>
        <button type="button" data-action="digit" data-value="3">3</button>
        <button type="button" class="operator" data-action="operator" data-value="+" aria-label="더하기">+</button>
        <button type="button" class="zero" data-action="digit" data-value="0">0</button>
        <button type="button" data-action="decimal" aria-label="소수점">.</button>
        <button type="button" class="equals" data-action="equals" aria-label="계산하기">=</button>
      </div>
      <p id="load-error" class="load-error" role="alert" hidden>jQuery를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.</p>
      <noscript><p class="load-error">계산기를 사용하려면 브라우저에서 JavaScript를 허용해 주세요.</p></noscript>
    </section>
    <p class="help">키보드로도 편하게 계산하세요.<br><kbd>Enter</kbd> 계산 · <kbd>Backspace</kbd> 한 자리 지우기 · <kbd>Esc</kbd> 초기화
      <span class="mode">입력한 순서대로 계산합니다. · 숫자 입력 최대 12자리</span>
    </p>
  </main>

  <!-- jQuery 공식 CDN. 인터넷 연결이 필요합니다. -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script id="calculator-script">
    // jQuery 로딩 실패 시 빈 화면 대신 안내를 표시합니다.
    if (!window.jQuery) {
      document.getElementById('load-error').hidden = false;
      document.querySelectorAll('button').forEach(function (button) { button.disabled = true; });
    } else {
      jQuery(function ($) {
        'use strict';

        // 일반 계산기처럼 연산자를 누를 때 앞의 계산을 확정합니다.
        var current = '0';
        var stored = null;
        var operator = null;
        var awaitingInput = false;
        var finished = false;
        var hasError = false;
        var lastOperator = null;
        var lastOperand = null;
        var expression = '';
        var symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

        function render() {
          $('#display').text(current).toggleClass('long', current.length > 12).toggleClass('error', hasError);
          $('#expression').text(expression);
          $('.operator').each(function () {
            var selected = $(this).attr('data-value') === operator;
            $(this).toggleClass('selected', selected).attr('aria-pressed', String(selected));
          });
        }

        function reset() {
          current = '0';
          stored = null;
          operator = null;
          awaitingInput = false;
          finished = false;
          hasError = false;
          lastOperator = null;
          lastOperand = null;
          expression = '';
        }

        function fail(message) {
          reset();
          hasError = true;
          current = '오류';
          expression = message;
        }

        // eval 없이 선택한 사칙연산만 실행합니다.
        function calculate(left, right, op) {
          if (op === '/' && right === 0) {
            fail('0으로 나눌 수 없습니다.');
            return null;
          }
          var result;
          switch (op) {
            case '+': result = left + right; break;
            case '-': result = left - right; break;
            case '*': result = left * right; break;
            case '/': result = left / right; break;
            default: return right;
          }
          if (!Number.isFinite(result)) {
            fail('계산 가능한 범위를 초과했습니다.');
            return null;
          }
          // 0.1 + 0.2 등의 부동소수점 표시 오차를 정리합니다.
          return Number(result.toPrecision(12));
        }

        function prepareEntry() {
          if (hasError || finished) reset();
          if (awaitingInput) {
            current = '0';
            awaitingInput = false;
          }
        }

        function digit(value) {
          prepareEntry();
          if (current.replace(/[-.]/g, '').length >= 12) return;
          if (current === '0') current = value;
          else if (current === '-0') current = '-' + value;
          else current += value;
        }

        function decimal() {
          prepareEntry();
          if (current.indexOf('.') === -1) current += '.';
        }

        function chooseOperator(next) {
          if (hasError) return;
          var value = Number(current);
          if (operator && !awaitingInput) {
            value = calculate(stored, value, operator);
            if (value === null) return;
            current = String(value);
          }
          stored = value;
          operator = next;
          awaitingInput = true;
          finished = false;
          lastOperator = null;
          lastOperand = null;
          expression = String(stored) + ' ' + symbols[operator];
        }

        function equals() {
          if (hasError) return;
          var op = operator || lastOperator;
          if (!op) return;
          var left = operator ? stored : Number(current);
          var right = operator ? Number(current) : lastOperand;
          var result = calculate(left, right, op);
          if (result === null) return;
          expression = left + ' ' + symbols[op] + ' ' + (right < 0 ? '(' + right + ')' : right) + ' =';
          current = String(result);
          lastOperator = op;
          lastOperand = right;
          stored = null;
          operator = null;
          awaitingInput = false;
          finished = true;
        }

        function changeSign() {
          if (hasError) reset();
          if (awaitingInput) { current = '0'; awaitingInput = false; }
          if (finished) { expression = ''; lastOperator = null; lastOperand = null; }
          current = current.charAt(0) === '-' ? current.slice(1) : '-' + current;
        }

        function backspace() {
          if (hasError || finished) { reset(); return; }
          if (awaitingInput) return;
          current = current.slice(0, -1);
          if (!current || current === '-') current = '0';
        }

        // 마우스와 키보드가 같은 처리 경로를 사용합니다.
        $('.keys').on('click', 'button', function () {
          var action = $(this).attr('data-action');
          var value = $(this).attr('data-value');
          switch (action) {
            case 'digit': digit(value); break;
            case 'decimal': decimal(); break;
            case 'operator': chooseOperator(value); break;
            case 'equals': equals(); break;
            case 'clear': reset(); break;
            case 'sign': changeSign(); break;
            case 'backspace': backspace(); break;
          }
          render();
        });

        $(document).on('keydown', function (event) {
          if (event.ctrlKey || event.metaKey || event.altKey || event.isComposing) return;
          var key = event.key;
          var selector;
          if (/^[0-9]$/.test(key)) selector = '[data-action="digit"][data-value="' + key + '"]';
          else if (['+', '-', '*', '/'].indexOf(key) !== -1) selector = '[data-action="operator"][data-value="' + key + '"]';
          else if (key === '.') selector = '[data-action="decimal"]';
          else if (key === 'Enter' || key === '=') selector = '[data-action="equals"]';
          else if (key === 'Escape' || key === 'Delete') selector = '[data-action="clear"]';
          else if (key === 'Backspace') selector = '[data-action="backspace"]';
          else return;
          event.preventDefault();
          var $button = $(selector);
          $button.trigger('click').addClass('pressed');
          window.setTimeout(function () { $button.removeClass('pressed'); }, 100);
        });
        render();
      });
    }
  </script>
</body>
</html>
